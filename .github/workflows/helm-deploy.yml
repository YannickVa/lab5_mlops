name: Helm Deployment

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy with Helm
      run: |
        helm upgrade --install my-app ./helm-chart \
          --namespace my-namespace \
          --create-namespace \
          --set image.tag=${{ github.sha }} \
          --set replicaCount=2 \
          --wait
